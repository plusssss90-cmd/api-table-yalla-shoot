name: Update Matches Data

on:
  schedule:
    - cron: '*/01 * * * *' # الكود سيشتغل تلقائياً كل 30 دقيقة
  workflow_dispatch: # يتيح لك تشغيله يدوياً لو أردت

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install requirements
      run: pip install requests pytz

    - name: Run script
      run: python fetch_matches.py

    - name: Commit and Push
      run: |
        git config --global user.name "Auto-Updater"
        git config --global user.email "bot@example.com"
        git add matches.json
        git commit -m "Auto update matches data" || exit 0
        git push
